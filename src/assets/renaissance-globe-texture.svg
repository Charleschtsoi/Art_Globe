<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <defs>
    <linearGradient id="parchment" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0e0c8"/>
      <stop offset="45%" stop-color="#e4cda8"/>
      <stop offset="100%" stop-color="#cfa87a"/>
    </linearGradient>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.35" result="desat"/>
      <feColorMatrix in="desat" type="matrix" values="1.15 0 0 0 0.12  0 0.92 0 0 0.06  0 0 0.72 0 0  0 0 0 0.07 0"/>
    </filter>
    <pattern id="grid" width="128" height="64" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V64" fill="none" stroke="#986844" stroke-opacity="0.2" stroke-width="1"/>
    </pattern>
    <style>
      .land { fill: #9a6f3c; fill-opacity: 0.68; stroke: #6b4428; stroke-width: 3; stroke-linejoin: round; }
      .coast { fill: none; stroke: #6d4528; stroke-opacity: .62; stroke-width: 2; stroke-linecap: round; }
      .label { font-family: "Times New Roman", serif; font-size: 44px; fill: #5a3820; fill-opacity: .32; letter-spacing: 8px; }
    </style>
  </defs>

  <rect width="2048" height="1024" fill="url(#parchment)"/>
  <rect width="2048" height="1024" fill="url(#grid)"/>
  <rect width="2048" height="1024" filter="url(#paperNoise)"/>

  <!-- Graticule lines (latitude/longitude) -->
  <g id="graticule" opacity="0.2">
    <path d="M0 128 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.42"/>
    <path d="M0 256 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M0 384 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M0 512 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M0 640 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M0 768 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M0 896 H2048" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>

    <path d="M128 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M384 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M640 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M896 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M1152 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M1408 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M1664 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M1920 0 V1024" fill="none" stroke="#6a3f28" stroke-width="1" stroke-opacity="0.45"/>
  </g>

  <!-- Compass rose -->
  <g id="compassRose" transform="translate(1700 40)">
    <circle cx="120" cy="120" r="78" fill="none" stroke="#6a3f28" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M120 42 L120 198" fill="none" stroke="#6a3f28" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M42 120 L198 120" fill="none" stroke="#6a3f28" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M120 58 L133 80 L120 86 L107 80 Z" fill="#6a3f28" fill-opacity="0.35"/>
    <text x="114" y="35" font-family="Times New Roman, serif" font-size="22" fill="#6a3f28" fill-opacity="0.35">N</text>
    <text x="186" y="126" font-family="Times New Roman, serif" font-size="22" fill="#6a3f28" fill-opacity="0.35">E</text>
    <text x="114" y="213" font-family="Times New Roman, serif" font-size="22" fill="#6a3f28" fill-opacity="0.35">S</text>
    <text x="34" y="126" font-family="Times New Roman, serif" font-size="22" fill="#6a3f28" fill-opacity="0.35">W</text>
  </g>

  <!-- Rough continent silhouettes for antique look -->
  <path class="land" d="M220,185 L370,150 L460,210 L520,280 L560,350 L525,430 L420,500 L300,560 L190,520 L140,430 L150,320 Z"/>
  <path class="land" d="M430,605 L520,585 L610,645 L655,750 L600,865 L500,905 L430,850 L385,745 Z"/>
  <path class="land" d="M920,210 L1090,170 L1270,205 L1415,275 L1460,390 L1370,455 L1210,465 L1040,430 L930,345 Z"/>
  <path class="land" d="M1180,520 L1310,505 L1420,555 L1495,655 L1510,750 L1430,835 L1290,860 L1165,810 L1110,710 L1125,610 Z"/>
  <path class="land" d="M1045,610 C1080,580 1120,580 1150,610 C1180,640 1175,700 1135,722 C1095,744 1060,715 1040,678 C1018,640 1012,626 1045,610 Z"/>
  <path class="land" d="M880,290 C910,265 950,265 980,295 C1010,325 995,370 960,385 C925,400 890,370 870,340 C853,314 855,305 880,290 Z"/>
  <path class="land" d="M1605,305 L1720,270 L1845,320 L1915,400 L1890,490 L1770,535 L1645,500 L1575,415 Z"/>
  <path class="land" d="M1715,620 L1800,600 L1890,640 L1940,710 L1905,810 L1810,865 L1710,840 L1660,760 L1670,680 Z"/>

  <path class="coast" d="M240 250 C310 230, 390 220, 470 295"/>
  <path class="coast" d="M950 245 C1100 215, 1250 250, 1395 330"/>
  <path class="coast" d="M1135 595 C1240 575, 1365 615, 1460 705"/>
  <path class="coast" d="M1620 360 C1705 330, 1805 350, 1885 425"/>

  <text class="label" x="160" y="95">ART GLOBE</text>
</svg>
